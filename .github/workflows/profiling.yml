name: Python profiling (manual)

on:
  workflow_dispatch:
    inputs:
      command:
        description: "Python command to profile (run from engines/thermal1d)"
        default: "python -m thermal1d verify --out /tmp/verify.json"

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: engines/thermal1d
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install "numpy>=1.22" "scipy>=1.8" py-spy scalene
          pip install -e .
      - name: Profile
        env:
          CMD: ${{ github.event.inputs.command }}
        run: |
          read -r -a args <<< "$CMD"
          ../../tools/profiling/profile.sh -o "$RUNNER_TEMP/profile" -- "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: thermal1d-profile
          path: ${{ runner.temp }}/profile
