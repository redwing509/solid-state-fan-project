[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "thermal1d"
version = "1.0.0"
description = "Solid State Fan in-house 1-D transient conduction engine (verified; flow-off cross-check for OpenFOAM thermal cases)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.22"]

[project.optional-dependencies]
fast = ["scipy>=1.8"]
test = ["pytest>=7", "scipy>=1.8"]

[project.scripts]
thermal1d = "thermal1d.cli:main"

[tool.setuptools]
packages = ["thermal1d"]

[tool.pytest.ini_options]
testpaths = ["tests"]
